<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фото для инстаграма | Vibe Batumi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400&family=Montserrat:wght@200;300&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --text-primary: #ffffff;
            --text-secondary: #a1a1a1;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }

        .font-heading {
            font-family: 'Montserrat', sans-serif;
            font-weight: 200;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .thin-border {
            border: 0.5px solid rgba(255, 255, 255, 0.1);
        }

        .back-link {
            transition: opacity 0.3s ease;
        }

        .back-link:hover {
            opacity: 0.6;
        }
    </style>
</head>

<body class="py-20 px-8 md:px-16">
    <header class="mb-20">
        <a href="index.html"
            class="back-link text-[9px] uppercase tracking-[0.5em] font-light text-gray-500 mb-8 block">← Back to
            Portfolio</a>
        <h1 class="text-3xl md:text-5xl font-heading mb-4">Фото для инстаграма</h1>
        <p class="text-[9px] text-gray-600 uppercase tracking-[0.6em]">Project Details & Gallery</p>
    </header>

    <main class="grid grid-cols-1 md:grid-cols-3 gap-8">
        <div class="aspect-[3/4] overflow-hidden thin-border"><img src="3.png" class="w-full h-full object-cover"
                alt="Instagram 1"></div>
        <div class="aspect-[3/4] overflow-hidden thin-border"><img src="3-1.png" class="w-full h-full object-cover"
                alt="Instagram 2"></div>
        <div class="aspect-[3/4] overflow-hidden thin-border"><img src="3-2.png" class="w-full h-full object-cover"
                alt="Instagram 3"></div>
        <div class="aspect-[3/4] overflow-hidden thin-border"><img src="3-3.png" class="w-full h-full object-cover"
                alt="Instagram 4"></div>
        <div class="aspect-[3/4] overflow-hidden thin-border"><img src="3-4.png" class="w-full h-full object-cover"
                alt="Instagram 5"></div>
        <div class="aspect-[3/4] overflow-hidden thin-border"><img src="3-5.png" class="w-full h-full object-cover"
                alt="Instagram 6"></div>
        <div class="aspect-[3/4] overflow-hidden thin-border"><img src="3-6.png" class="w-full h-full object-cover"
                alt="Instagram 7"></div>
    </main>

    <footer class="mt-32 pt-16 border-t border-white/5 text-center">
        <div class="text-[9px] font-light tracking-[0.5em] uppercase text-gray-600">© 2026 Vibe Batumi</div>
    </footer>
</body>

</html>
